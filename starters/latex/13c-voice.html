
<script data-marble-id="__ID__">
// ------------------------------------------------- the Active Voice checker
//
// A writing check that runs in the page — no network, no model, just rules.
// It reads the prose in the Visual view and draws a faint green squiggle
// under anything that reads as passive, hedged, wordy, adverb-heavy, or
// simply too long. Hover a squiggle for the reason: there is always an
// action — apply a suggested fix, or jump the caret into the flagged words
// to rewrite them by hand.
//
// The "Active Voice" button in the header toggles the whole thing (on by
// default); the ▾ on it opens a side panel with one switch per check.
// Nothing is kept in the document except `data-check` / `data-check-off` on
// the shell — whether the checker runs, and which checks.

(() => {
  const app = document.querySelector('#app');
  const page = document.querySelector('#richpage');
  const views = document.querySelector('.richviews');
  if (!app || !page || !views) return;

  const room = () => window.__latexroom;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ZWSP = '​';
  let carrier = null;

  // ---------------------------------------------------------------- word lists

  const FILLER = new Set(('very really quite extremely incredibly remarkably particularly especially notably significantly '
    + 'substantially considerably relatively fairly rather somewhat arguably essentially basically actually literally simply '
    + 'just clearly obviously evidently certainly definitely undoubtedly importantly interestingly surprisingly ultimately '
    + 'effectively generally typically virtually practically completely totally absolutely entirely perfectly utterly hugely '
    + 'vastly greatly deeply highly strongly heavily truly quite somewhat').split(' '));
  const ADV_NOT = new Set('only family apply reply supply ally rely bully jelly early holy ugly silly lily assembly anomaly panoply multiply imply comply July italy likely'.split(' '));
  const NOT_PART = new Set(('important different relevant significant consistent present absent apparent evident sufficient '
    + 'efficient current recent silent distinct correct direct exact compact abstract complete concrete discrete private '
    + 'separate appropriate accurate adequate immediate ultimate alternate deliberate elaborate delicate definite opposite '
    + 'favourite favorite moderate desperate content extent intent talent client patient ancient decent frequent element '
    + 'moment comment segment argument document instrument component treatment agreement statement equipment candidate '
    + 'template estimate associate corporate coordinate intimate legitimate passionate fortunate').split(' '));
  const HEDGE = /\b(quite|rather|somewhat|fairly|a bit|kind of|sort of|arguably|relatively|comparatively|reasonably|more or less|to some extent|in some sense|perhaps|possibly|presumably|seemingly|apparently|it seems|it appears|we believe|we feel)\b/gi;
  const VAGUE = /\b(several|various|numerous|a variety of|a range of|a lot of|lots of|plenty of|a number of|a couple of)\s+([a-z]+)/gi;
  const NOMINAL = {
    decision: 'decide', analysis: 'analyse', investigation: 'investigate', assumption: 'assume', conclusion: 'conclude',
    evaluation: 'evaluate', consideration: 'consider', comparison: 'compare', description: 'describe', discussion: 'discuss',
    examination: 'examine', explanation: 'explain', contribution: 'contribute', reduction: 'reduce', improvement: 'improve',
    measurement: 'measure', assessment: 'assess', adjustment: 'adjust', implementation: 'implement', observation: 'observe',
    recommendation: 'recommend', application: 'apply', modification: 'modify', selection: 'select', extension: 'extend',
  };
  const PHRASES = [
    ['in order to', 'to'], ['in order for', 'for'], ['due to the fact that', 'because'],
    ['owing to the fact that', 'because'], ['in spite of the fact that', 'although'], ['despite the fact that', 'although'],
    ['in the event that', 'if'], ['in the case that', 'if'], ['at this point in time', 'now'], ['at the present time', 'now'],
    ['in the near future', 'soon'], ['a large number of', 'many'], ['a great deal of', 'much'], ['the majority of', 'most'],
    ['a majority of', 'most'], ['the vast majority of', 'almost all'], ['with regard to', 'about'], ['with respect to', 'about'],
    ['in relation to', 'about'], ['in terms of', 'for'], ['for the purpose of', 'to'], ['it should be noted that', ''],
    ['it is worth noting that', ''], ['it is important to note that', ''], ['as a matter of fact', ''], ['each and every', 'every'],
    ['first and foremost', 'first'], ['in a timely manner', 'promptly'], ['prior to', 'before'], ['subsequent to', 'after'],
    ['in conjunction with', 'with'], ['on a regular basis', 'regularly'], ['the fact that', 'that'], ['whether or not', 'whether'],
    ['is able to', 'can'], ['are able to', 'can'], ['has the ability to', 'can'], ['have the ability to', 'can'],
    ['utilize', 'use'], ['utilise', 'use'], ['methodology', 'method'], ['in my opinion', ''], ['needless to say', ''],
  ];
  const cap = (s) => s.replace(/^([a-z])/, (c) => c.toUpperCase());

  // ---------------------------------------------------------------- the checks
  //
  // Seven. Each: check(sentence) → [{ s, e, fix?, tip }], with [s, e) a range
  // in the sentence; `cat` is a colour band, forest → lime.

  const RULES = [
    {
      id: 'passive', label: 'Passive voice', cat: 'a',
      blurb: 'A “to be” verb plus a past participle. Name who acts.',
      check(t) {
        const out = [];
        const re = /\b(am|is|are|was|were|be|been|being|get|gets|got|gotten)\s+((?:[a-z]+ly\s+)?)([a-z]{3,}(?:ed|en|wn|ne|lt|pt|ft|nt|ught))\b(\s+by\s+(?:the\s+|a\s+|an\s+|our\s+|their\s+|its\s+)?[a-z][\w'-]+(?:\s+[a-z][\w'-]+)?)?/gi;
        let m;
        while ((m = re.exec(t))) {
          const part = m[3].toLowerCase();
          if (NOT_PART.has(part)) continue;
          if (!m[4] && /^(interest|excit|tir|pleas|concern|involv|relat|bas|locat|limit|dedicat|commit|motivat|experienc|qualif|complicat|detail|advanc|sophisticat|establish|expect|surpris|worri|prepar|suit|determin)/.test(part)) continue;
          if (!m[4] && /^(need|use|suppose|require|expect|intend|want)ed$/.test(part)) continue;
          if (!/(ed|en|wn|ught)$/.test(part) && !m[4] && !/(built|felt|kept|left|sent|spent|meant|lost|dealt|slept|swept|found)$/.test(part)) continue;
          const agent = m[4] ? m[4].replace(/^\s+by\s+(the|a|an)\s+/i, ' by ').trim().replace(/^by\s+/, '') : '';
          out.push({ s: m.index, e: m.index + m[0].length, tip: agent ? `Make “${agent}” the subject and use an active verb.` : 'Name the actor and use an active verb.' });
        }
        return out;
      },
    },
    {
      id: 'adverbs', label: 'Weak adverbs', cat: 'c',
      blurb: '“-ly” words and intensifiers that add length, not meaning.',
      check(t) {
        const out = [];
        const re = /\b([a-z]{3,}ly|very)\b/gi;
        let m;
        while ((m = re.exec(t))) {
          const w = m[1].toLowerCase();
          if (ADV_NOT.has(w)) continue;
          const filler = w === 'very' || FILLER.has(w);
          let e = m.index + m[0].length;
          if (t[e] === ' ') e += 1;
          out.push({ s: m.index, e, fix: '', tip: filler ? `“${m[1]}” rarely earns its place — cut it.` : 'A sharper verb often replaces an “-ly” adverb.' });
        }
        return out;
      },
    },
    {
      id: 'hedging', label: 'Hedging', cat: 'c',
      blurb: 'Qualifiers and vague amounts that soften the claim.',
      check(t) {
        const out = [];
        let m;
        HEDGE.lastIndex = 0;
        while ((m = HEDGE.exec(t))) { let e = m.index + m[0].length; if (t[e] === ' ') e += 1; out.push({ s: m.index, e, fix: '', tip: `“${m[1]}” — say it plainly.` }); }
        VAGUE.lastIndex = 0;
        while ((m = VAGUE.exec(t))) out.push({ s: m.index, e: m.index + m[1].length, tip: 'How many, exactly? Give the number.' });
        return out;
      },
    },
    {
      id: 'nominalization', label: 'Buried verbs', cat: 'b',
      blurb: 'A verb hiding in a noun — “make a decision” → “decide”.',
      check(t) {
        const out = [];
        const re = /\b(make|makes|made|perform|performs|performed|conduct|conducts|conducted|provide|provides|provided|carry out|carries out|carried out|reach|reaches|reached|give|gives|gave|do|does|did)\s+(a|an|the)?\s*([a-z]+)\b/gi;
        let m;
        while ((m = re.exec(t))) {
          const v = NOMINAL[m[3].toLowerCase()];
          if (v) out.push({ s: m.index, e: m.index + m[0].length, fix: v, tip: `“${m[1]}${m[2] ? ' ' + m[2] : ''} ${m[3]}” → “${v}”.` });
        }
        return out;
      },
    },
    {
      id: 'wordy', label: 'Wordy phrases', cat: 'b',
      blurb: 'Long forms with a short equivalent — “in order to” → “to”.',
      check(t) {
        const out = [];
        for (const [long, short] of PHRASES) {
          const re = new RegExp('\\b' + long.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
          let m;
          while ((m = re.exec(t))) {
            let e = m.index + m[0].length;
            let fix = short;
            if (!short && t[e] === ' ') e += 1;
            out.push({ s: m.index, e, fix, tip: short ? `→ “${short}”` : 'Delete — it adds nothing.' });
          }
        }
        return out;
      },
    },
    {
      id: 'openers', label: 'Weak openers', cat: 'b',
      blurb: '“There is”, “It is … that”, or a sentence starting with a bare “This”.',
      check(t) {
        const out = [];
        let m = /^(\s*)there\s+(is|are|was|were|has been|have been|exists?|remains?)\b/i.exec(t);
        if (m) out.push({ s: m[1].length, e: m.index + m[0].length, tip: 'Lead with the subject; drop “there is”.' });
        m = /\bit\s+(is|was)\s+(?:[a-z]+\s+){0,3}that\b/i.exec(t) || /\bit\s+(is|was)\s+(important|necessary|possible|clear|worth|likely|crucial|essential|useful)\s+(to|that)\b/i.exec(t);
        if (m) out.push({ s: m.index, e: m.index + m[0].length, tip: 'Cut the “it is … that” frame and state the point.' });
        m = /^(\s*)(This|These|That|Those|It)\s+(is|are|was|were|will|would|can|could|may|might|should|has|have|had|means|shows|makes|allows|enables|provides|leads|results)\b/.exec(t);
        if (m) out.push({ s: m[1].length, e: m[1].length + m[2].length, tip: `“${m[2]} ___” — add the noun it refers to.` });
        return out;
      },
    },
    {
      id: 'long-sentence', label: 'Long sentences', cat: 'e',
      blurb: 'Over 36 words. A full stop in the middle would help.',
      check(t) {
        const words = t.trim().split(/\s+/).filter(Boolean);
        if (words.length <= 36) return [];
        const lead = t.replace(/^\s+/, '');
        const off = t.length - lead.length;
        let e = lead.search(/[,;:]/);
        if (e < 6 || e > 52) e = Math.min(lead.length, 46);
        return [{ s: off, e: off + e, tip: `${words.length} words — a full stop or a list would help.` }];
      },
    },
  ];
  const byId = new Map(RULES.map((r) => [r.id, r]));

  // ---------------------------------------------------------------- state

  const checkerOn = () => app.getAttribute('data-check') !== 'off';
  const disabled = () => new Set((app.getAttribute('data-check-off') || '').split('|').filter(Boolean));
  const ruleOn = (id) => checkerOn() && !disabled().has(id);

  function fileAttr(name, value) {
    app.setAttribute(name, value);
    const id = carrier && carrier.id(app);
    if (id) carrier.op({ type: 'setAttr', id, name, value }, { immediate: true });
  }

  // ----------------------------------------------------- the toggle + panel

  const btn = document.createElement('button');
  btn.className = 'btn voice-btn';
  btn.id = 'voice-toggle';
  btn.setAttribute('data-marble-transient', '');
  btn.innerHTML = 'Active Voice <span class="voice-caret" title="Which checks">▾</span>';
  views.append(btn);

  const panel = document.createElement('aside');
  panel.className = 'voice-side';
  panel.id = 'voice-panel';
  panel.setAttribute('data-marble-transient', '');
  panel.hidden = true;
  document.body.append(panel);

  function fillPanel() {
    const off = disabled();
    panel.innerHTML = '<header class="vs-head"><b>Active Voice</b>'
      + `<label class="vs-master"><input type="checkbox" data-master${checkerOn() ? ' checked' : ''}><span>on</span></label>`
      + '<button class="vs-x" type="button" aria-label="Close">✕</button></header>'
      + '<p class="vs-intro">Rule-based, run in this page. Nothing is sent anywhere.</p>'
      + '<ul class="vs-list">' + RULES.map((r) => `<li class="vs-row">`
        + `<label><input type="checkbox" data-rule="${r.id}"${off.has(r.id) ? '' : ' checked'}>`
        + `<span class="vs-sw sq-${r.cat}"></span>`
        + `<span class="vs-name">${esc(r.label)}</span></label>`
        + `<span class="vs-blurb">${esc(r.blurb)}</span></li>`).join('') + '</ul>';
  }

  function openPanel() { fillPanel(); panel.hidden = false; requestAnimationFrame(() => panel.setAttribute('data-open', '')); }
  function closePanel() { panel.removeAttribute('data-open'); setTimeout(() => { panel.hidden = true; }, 220); }

  function reflectBtn() {
    btn.setAttribute('aria-pressed', String(checkerOn()));
    if (checkerOn()) btn.removeAttribute('data-off'); else btn.setAttribute('data-off', '');
  }

  btn.addEventListener('click', (event) => {
    if (event.target.closest('.voice-caret')) { panel.hasAttribute('data-open') ? closePanel() : openPanel(); return; }
    fileAttr('data-check', checkerOn() ? 'off' : 'on');
    reflectBtn();
    scan();
  });

  panel.addEventListener('change', (event) => {
    const cb = event.target.closest('input');
    if (!cb) return;
    if (cb.hasAttribute('data-master')) { fileAttr('data-check', cb.checked ? 'on' : 'off'); reflectBtn(); scan(); return; }
    const set = disabled();
    if (cb.checked) set.delete(cb.getAttribute('data-rule')); else set.add(cb.getAttribute('data-rule'));
    fileAttr('data-check-off', [...set].join('|'));
    scan();
  });
  panel.addEventListener('click', (event) => { if (event.target.closest('.vs-x')) closePanel(); });
  document.addEventListener('click', (event) => {
    if (panel.hasAttribute('data-open') && !event.target.closest('#voice-panel') && !event.target.closest('#voice-toggle')) closePanel();
  });

  // ---------------------------------------------------------------- scan

  const SKIP = /(?:^|\s)(rctl|renv|rmath|rverb|rcom|rhead|richgap|delim)(?:\s|$)/;
  const rowText = (row) => row.textContent.split(ZWSP).join('');
  const isProse = (row) => row.classList.contains('rline') && !SKIP.test(' ' + row.className + ' ')
    && rowText(row).trim() && !row.hasAttribute('data-here')
    && !row.hasAttribute('data-cfold') && !row.hasAttribute('data-fold');

  const ABBR = /\b(?:e\.g|i\.e|cf|vs|et al|Fig|Eq|Sec|Tab|pp|Dr|Mr|Mrs|Ms|Ph\.D|U\.S)\.$/;

  function splitSentences(text) {
    const out = [];
    let start = 0;
    const re = /[.!?]["')\]]?(\s+)/g;
    let m;
    while ((m = re.exec(text))) {
      const head = text.slice(start, m.index + 1).trimEnd();
      if (ABBR.test(head) || /\b[A-Z][a-z]?\.$/.test(head)) continue;
      out.push({ text: text.slice(start, m.index + 1), off: start });
      start = m.index + m[0].length;
    }
    if (start < text.length) out.push({ text: text.slice(start), off: start });
    return out;
  }

  function clearSquiggles() {
    for (const sq of [...page.querySelectorAll('.sq')]) {
      const t = document.createTextNode(sq.textContent);
      sq.replaceWith(t);
    }
    for (const row of page.querySelectorAll('.rline')) row.normalize();
  }

  let scanQueued = false;
  function queueScan() {
    if (scanQueued) return;
    scanQueued = true;
    requestAnimationFrame(() => { scanQueued = false; scan(); });
  }

  function scan() {
    if (app.getAttribute('data-view') !== 'rich') return;
    clearSquiggles();
    if (!checkerOn()) return;
    const r = room();
    const sec = r && r.activeSection && r.activeSection();
    if (sec && r.kindOf && r.kindOf(sec) !== 'tex') return;

    const rows = [...page.children].filter((el) => el.classList.contains('rline'));
    let para = [];
    const flush = () => { if (para.length) markParagraph(para); para = []; };
    for (const row of rows) { if (isProse(row)) para.push(row); else flush(); }
    flush();
  }

  function markParagraph(para) {
    const texts = para.map(rowText);
    const bounds = [];
    let acc = 0;
    for (const t of texts) { bounds.push(acc); acc += t.length + 1; }
    const full = texts.join(' ');

    const all = [];
    for (const sent of splitSentences(full)) {
      for (const rule of RULES) {
        if (!ruleOn(rule.id)) continue;
        let hits;
        try { hits = rule.check(sent.text) || []; } catch (e) { hits = []; }
        for (const hit of hits) {
          const gs = sent.off + hit.s;
          const ge = sent.off + hit.e;
          if (ge > gs) all.push({ gs, ge, rule, hit });
        }
      }
    }
    all.sort((x, y) => x.gs - y.gs
      || (y.hit.fix != null) - (x.hit.fix != null)
      || (x.ge - x.gs) - (y.ge - y.gs));

    let cursor = -1;
    for (const h of all) {
      if (h.gs < cursor) continue;
      cursor = h.ge;
      const touched = [];
      for (let ri = 0; ri < para.length; ri += 1) {
        const rs = bounds[ri];
        const reoff = rs + texts[ri].length;
        const a = Math.max(h.gs, rs);
        const b = Math.min(h.ge, reoff);
        if (a < b) touched.push({ ri, a: a - rs, b: b - rs });
      }
      const single = touched.length === 1;
      touched.forEach((seg, k) => {
        wrapInRow(para[seg.ri], seg.a, seg.b, h.rule, h.hit, {
          first: k === 0,
          rowI: Number(para[seg.ri].dataset.i),
          ls: seg.a,
          fixable: single && h.hit.fix != null,
        });
      });
    }
  }

  function wrapInRow(row, ls, le, rule, hit, meta) {
    const walker = document.createTreeWalker(row, NodeFilter.SHOW_TEXT);
    let seen = 0;
    const jobs = [];
    let node = walker.nextNode();
    while (node) {
      const len = node.nodeValue.length;
      const a = Math.max(ls - seen, 0);
      const b = Math.min(le - seen, len);
      if (a < b && !(node.parentElement && node.parentElement.classList.contains('mk'))) jobs.push({ node, a, b });
      seen += len;
      node = walker.nextNode();
    }
    jobs.forEach((job, k) => {
      let target = job.node;
      if (job.a > 0) target = target.splitText(job.a);
      if (job.b - job.a < target.nodeValue.length) target.splitText(job.b - job.a);
      const sq = document.createElement('span');
      sq.className = `sq sq-${rule.cat}`;
      sq.setAttribute('data-marble-transient', '');
      sq.dataset.rule = rule.id;
      sq.dataset.tip = hit.tip || rule.blurb;
      if (meta.first && k === 0) {
        sq.dataset.i = String(meta.rowI);
        sq.dataset.ls = String(meta.ls);
        if (meta.fixable) { sq.dataset.fix = hit.fix; sq.dataset.le = String(le); }
      }
      target.parentNode.replaceChild(sq, target);
      sq.appendChild(target);
    });
  }

  // ------------------------------------------------------- hover + actions

  let tip = null;
  let tipTimer = null;
  const killTip = () => { if (tip) { tip.remove(); tip = null; } };

  page.addEventListener('mouseover', (event) => {
    const sq = event.target.closest && event.target.closest('.sq');
    if (!sq) return;
    clearTimeout(tipTimer);
    showTip(sq);
  });
  page.addEventListener('mouseout', (event) => {
    const to = event.relatedTarget;
    if (!to || !to.closest || (!to.closest('.sq') && !to.closest('.sqtip'))) tipTimer = setTimeout(killTip, 160);
  });

  function anchorSq(sq) {
    // the .sq that carries the coords is the first fragment of the match
    if (sq.dataset.i !== undefined) return sq;
    let el = sq;
    while ((el = el.previousElementSibling || (el.parentElement && el.parentElement.previousElementSibling))) {
      if (el.classList && el.classList.contains('sq') && el.dataset.rule === sq.dataset.rule && el.dataset.i !== undefined) return el;
    }
    return sq;
  }

  function showTip(sq) {
    killTip();
    const rule = byId.get(sq.dataset.rule);
    const src = anchorSq(sq);
    tip = document.createElement('div');
    tip.className = 'sqtip';
    tip.setAttribute('data-marble-transient', '');
    const hasFix = src.dataset.fix !== undefined;
    tip.innerHTML = `<div class="st-head"><span class="st-dot sq-${rule ? rule.cat : 'c'}"></span>${esc(rule ? rule.label : 'Note')}</div>`
      + `<div class="st-tip">${esc(sq.dataset.tip || (rule && rule.blurb) || '')}</div>`
      + '<div class="st-acts">'
      + (hasFix ? `<button class="st-btn st-primary" type="button" data-do="fix">${src.dataset.fix === '' ? 'Delete' : 'Replace with “' + esc(src.dataset.fix) + '”'}</button>` : '')
      + (src.dataset.i !== undefined ? '<button class="st-btn" type="button" data-do="edit">Edit here</button>' : '')
      + '</div>';
    document.body.append(tip);
    const b = sq.getBoundingClientRect();
    tip.style.left = `${Math.max(8, Math.min(b.left, window.innerWidth - 300))}px`;
    tip.style.top = `${Math.min(b.bottom + 6, window.innerHeight - 16)}px`;
    tip.addEventListener('mouseenter', () => clearTimeout(tipTimer));
    tip.addEventListener('mouseleave', () => { tipTimer = setTimeout(killTip, 160); });
    tip.addEventListener('click', (event) => {
      const act = event.target.closest('[data-do]');
      if (!act) return;
      if (act.getAttribute('data-do') === 'fix') applyFix(src);
      else editHere(src);
    });
  }

  function activePre() {
    const r = room();
    const sec = r && r.activeSection && r.activeSection();
    return sec && r.preOf ? r.preOf(sec) : null;
  }

  function applyFix(src) {
    const pre = activePre();
    if (!pre) return;
    const i = Number(src.dataset.i);
    const ls = Number(src.dataset.ls);
    const le = Number(src.dataset.le);
    const lines = pre.textContent.split('\n');
    if (!(i >= 0 && i < lines.length) || le > lines[i].length) return;
    lines[i] = (lines[i].slice(0, ls) + src.dataset.fix + lines[i].slice(le)).replace(/ {2,}/g, ' ').replace(/\s+([,.;:])/g, '$1');
    killTip();
    room().writeSource(pre, lines.join('\n'), { coalesce: false });
  }

  function editHere(src) {
    killTip();
    const rv = window.__richview;
    const row = rv && rv.rowAt(Number(src.dataset.i));
    if (rv && row) rv.placeCaret(row, Number(src.dataset.ls));
  }

  // ------------------------------------------------------------- wiring

  document.addEventListener('latex:rendered', queueScan);
  new MutationObserver(() => { reflectBtn(); queueScan(); })
    .observe(app, { attributes: true, attributeFilter: ['data-view', 'data-check', 'data-check-off'] });
  window.addEventListener('resize', () => { killTip(); if (panel.hasAttribute('data-open')) closePanel(); });
  const sc = document.querySelector('#richscroll');
  if (sc) sc.addEventListener('scroll', killTip, { passive: true });

  (room().onReady || ((cb) => cb()))((marble) => {
    carrier = marble || (window.marble || null);
    reflectBtn();
    queueScan();
  });
})();
</script>
