//
// 04b measures the page in Linux Libertine and 06 used to draw it in Times,
// because Times is one of the fourteen fonts every PDF reader owns and
// Libertine is not. This fragment is the step after that one: the actual
// Linux Libertine O and Linux Biolinum O faces acmart loads
// (\RequirePackage[tt=false, type1=true]{libertine}), subsetted to the
// WinAnsi character set the engine can produce, each one carrying the
// FontDescriptor a PDF needs. 06 embeds these when they are here, so the
// letters on the page are the ones a real acmart build would set, and the
// widths 04b measured are finally the widths of the glyphs actually drawn.
//
// Roman keys (rm rmb rmi rmbi) are Linux Libertine O; sans keys (sf sfb sfi)
// are Linux Biolinum O. Monospace stays Courier and mathematics stays Symbol
// -- acmart sets those in Inconsolata and newtxmath, which are the next
// faces to bring across. Linux Libertine is GPL with the font exception (so
// embedding it in a document places no licence on the document) and also SIL
// OFL; the texts travel in starters/latex/vendor/.
//
// Built from the CTAN libertine package. The subsetter is not in this repo;
// the recipe is: pyftsubset <face>.otf --unicodes=<WinAnsi> --layout-features=
// --no-hinting --desubroutinize --glyph-names, then wrap each result base64
// with the FontBBox / ItalicAngle / Ascent / Descent / CapHeight the OS/2 and
// head tables give.
