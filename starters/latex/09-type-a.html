
<script data-marble-id="__ID__">
// --------------------------------------------------------------- typesetting
//
// The part that turns tokens into pages. Everything on a page arrives as a
// row: a height above the baseline, a depth below it, and items already
// positioned relative to that baseline. A line of text is a row, a displayed
// equation is a row, a table is a row. Pagination therefore has one rule —
// place the row if it fits, move on if it does not — and "move on" is a column
// when the page has another one and a new page when it does not. That is the
// whole of two-column setting: the measure is narrower, and a full frame is
// not always a full page.
//
// Two things take their space from the bottom of a frame that is still being
// filled: footnotes, which belong to the column they were called from, and the
// block a conference class hangs under the first column of the first page.

(() => {
  const T = window.TeX;
  const M = () => T.metrics;

  // TeX measures in points of 1/72.27 inch and PDF in points of 1/72: a third
  // of a percent, which is a line in three hundred. A class that states its
  // lengths in TeX points (acmart does) multiplies by this.
  const PT = 72 / 72.27;

  const PAPER = {
    letterpaper: [612, 792],
    a4paper: [595.28, 841.89],
    a5paper: [419.53, 595.28],
    legalpaper: [612, 1008],
    executivepaper: [540, 720],
  };

  const SIZES = {
    tiny: 0.5, scriptsize: 0.7, footnotesize: 0.8, small: 0.9, normalsize: 1,
    large: 1.2, Large: 1.44, LARGE: 1.728, huge: 2.074, Huge: 2.488,
  };

  // What a text-mode control sequence stands for, when it stands for one
  // character. The accents are separate because they take an argument.
  const GLYPHS = {
    '%': '%', '$': '$', '&': '&', '#': '#', '_': '_', '{': '{', '}': '}',
    textbackslash: '\\', textasciitilde: '~', textasciicircum: '^',
    ldots: '…', dots: '…', textellipsis: '…',
    textendash: '–', textemdash: '—', textbullet: '•',
    S: '§', P: '¶', copyright: '©', pounds: '£', dag: '†', ddag: '‡',
    textdegree: '°', textquotedblleft: '“', textquotedblright: '”',
    textquoteleft: '‘', textquoteright: '’', textregistered: '®',
    texttrademark: '™', ae: 'æ', AE: 'Æ', oe: 'œ', OE: 'Œ', ss: 'ß',
    o: 'ø', O: 'Ø', aa: 'å', AA: 'Å', l: 'l', L: 'L', i: 'ı', j: 'j',
    textbar: '|', textless: '<', textgreater: '>', textbraceleft: '{',
    textbraceright: '}', slash: '/', textperiodcentered: '·',
  };

  const ACCENTS = {
    "'": { a: 'á', e: 'é', i: 'í', o: 'ó', u: 'ú', y: 'ý', c: 'ć', n: 'ń', s: 'ś', A: 'Á', E: 'É', I: 'Í', O: 'Ó', U: 'Ú' },
    '`': { a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù', A: 'À', E: 'È', I: 'Ì', O: 'Ò', U: 'Ù' },
    '"': { a: 'ä', e: 'ë', i: 'ï', o: 'ö', u: 'ü', y: 'ÿ', A: 'Ä', E: 'Ë', I: 'Ï', O: 'Ö', U: 'Ü' },
    '^': { a: 'â', e: 'ê', i: 'î', o: 'ô', u: 'û', A: 'Â', E: 'Ê', I: 'Î', O: 'Ô', U: 'Û' },
    '~': { a: 'ã', n: 'ñ', o: 'õ', A: 'Ã', N: 'Ñ', O: 'Õ' },
    c: { c: 'ç', C: 'Ç' },
    v: { s: 'š', z: 'ž', c: 'č', S: 'Š', Z: 'Ž' },
    '=': {}, '.': {}, u: {}, H: {},
  };

  const ITEM_MARKS = ['•', '–', '·', '*'];
  const ROMAN = [[1000,'m'],[900,'cm'],[500,'d'],[400,'cd'],[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']];

  const roman = (value) => {
    let out = '';
    let left = value;
    for (const [v, s] of ROMAN) while (left >= v) { out += s; left -= v; }
    return out;
  };
  const alpha = (value) => String.fromCharCode(96 + ((value - 1) % 26) + 1);

  /** A length, in points. Understands the units a document actually uses, and
   *  the two that are really fractions of the measure. */
  function length(text, job, fallback = 0) {
    if (!text) return fallback;
    const clean = String(text).trim();
    const relative = /^([-\d.]*)\s*\\(textwidth|linewidth|columnwidth|hsize|paperwidth)/.exec(clean);
    if (relative) {
      const whole = relative[2] === 'paperwidth' ? job.W : job.measure;
      return (relative[1] === '' ? 1 : Number(relative[1])) * whole;
    }
    const match = /^([-\d.]+)\s*(pt|bp|in|cm|mm|em|ex|pc|sp)?/.exec(clean);
    if (!match) return fallback;
    const value = Number(match[1]);
    const unit = match[2] || 'pt';
    const size = job.font.size;
    const per = {
      pt: 1, bp: 1, in: 72, cm: 28.3465, mm: 2.83465, pc: 12, sp: 1 / 65536,
      em: size, ex: M().xHeight('rm', size),
    };
    return value * (per[unit] === undefined ? 1 : per[unit]);
  }

  // ------------------------------------------------------------------- a job

  function createJob(options) {
    const job = {
      paper: options.paper || 'letterpaper',
      base: options.base || 10,
      margin: options.margin || 72,
      title: '', author: '', date: null,
      log: options.log,
      refs: options.refs || {},
      images: options.images || {},
      files: options.files || [],
      macros: new Map(),
      labels: {},
      toc: [],
      outline: [],
      cites: [],
      counters: { section: 0, subsection: 0, subsubsection: 0, figure: 0, table: 0, equation: 0, footnote: 0, page: 1 },
      font: { family: 'rm', bold: false, italic: false, size: options.base || 10, sc: false },
      align: 'justify',
      // Columns. `cols` frames across the measure, filled left to right; a
      // spanning zone ignores them and runs the full width, which is what a
      // title block and a starred float are.
      cols: 1,
      colGap: 0,
      colIndex: 0,
      columnTop: 0,
      spanning: false,
      wide: [],
      colour: null,
      colours: {},
      columnTypes: new Map(),
      atBegin: [],
      appendix: false,
      docClass: 'article',
      klass: 'article',
      bibStyle: 'plain',
      authors: [],
      acm: {},
      ccs: [],
      keywordTokens: null,
      teaser: null,
      held: {},
      bottomBlock: null,
      lineMap: {},
      leftSkip: 0,
      rightSkip: 0,
      parindent: true,
      inTitlePage: false,
      nodes: [],
      word: null,
      list: [],
      notes: [],
      pendingNotes: [],
      floatQueue: [],
      started: false,
      inFront: false,
    };

    const [width, height] = PAPER[job.paper] || PAPER.letterpaper;
    job.W = width;
    job.H = height;
    job.marginTop = options.marginTop || job.margin;
    job.marginBottom = options.marginBottom || job.margin;
    layout(job);
    job.doc = T.pdf.create({ title: '', author: '' });
    job.page = null;
    job.pageIndex = -1;
    job.y = 0;
    job.prevDepth = 0;
    job.firstOnPage = true;
    job.colNotes = [[]];
    job.colNoteHeight = [0];
    return job;
  }

  // -------------------------------------------------------------- the frames

  /** The measure, from the page and the number of columns. Called whenever
   *  either changes, because everything downstream reads `job.measure` and
   *  nothing downstream needs to know why it is what it is. */
  function layout(job) {
    job.textWidth = job.fixedTextWidth || (job.W - job.margin * 2);
    job.colWidth = (job.textWidth - job.colGap * (job.cols - 1)) / job.cols;
    job.measure = job.spanning ? job.textWidth : job.colWidth;
  }

  // A two-sided class moves the text block between left and right pages; the
  // page sets `left` when it starts, and everything that places a column
  // reads it from here.
  const leftEdge = (job) => (job.left === undefined ? job.margin : job.left);
  const columnX = (job, index) => leftEdge(job) + index * (job.colWidth + job.colGap);
  const frameX = (job) => (job.spanning ? leftEdge(job) : columnX(job, job.colIndex));

  /** How much of the bottom of this frame is promised to something else: the
   *  footnotes called from it, and on the first page the block a conference
   *  class hangs under the first column. */
  function reserved(job) {
    const col = job.spanning ? 0 : job.colIndex;
    let room = job.spanning
      ? Math.max(0, ...job.colNoteHeight)
      : job.colNoteHeight[col] || 0;
    const block = job.bottomBlock;
    if (block && job.pageIndex === block.page && (job.spanning || col === block.col)) {
      room += block.height;
    }
    return room;
  }

  function nextColumn(job) {
    job.colIndex += 1;
    job.y = job.columnTop;
    job.firstOnPage = true;
    job.prevDepth = 0;
    beginColumn(job);
  }

  /** A column is starting: what was set in it so far is nothing, and the
   *  floats that were waiting for a column top get this one first. */
  function beginColumn(job) {
    job.colStart = job.page ? job.page.items.length : 0;
    job.colStretch = [];
    job.colFloatTop = job.y;
    job.colFloatCount = 0;
    job.lastSkip = 0;
    job.keeping = null;
    if (job.page && !job.spanning && typeof placeQueuedFloats === 'function') placeQueuedFloats(job);
  }

  /** \flushbottom. A column that ends because the next line would not fit is
   *  stretched until its last baseline sits on the bottom of the text block,
   *  the slack shared among the skips that can stretch (the space above a
   *  heading, around a list, under a float) in proportion to how far each of
   *  them may. Lines themselves never move apart: baselineskip has no stretch. */
  function flushColumn(job) {
    if (!job.flushBottom || job.spanning || !job.page || !job.colStretch || !job.colStretch.length) return;
    const floor = job.marginBottom + reserved(job);
    const slack = job.y - floor;
    if (slack <= 0.01) return;
    const total = job.colStretch.reduce((sum, glue) => sum + glue.amount, 0);
    if (total <= 0) return;
    const ratio = slack / total;
    const items = job.page.items;
    let g = 0;
    let shift = 0;
    for (let i = job.colStart; i < items.length; i += 1) {
      while (g < job.colStretch.length && job.colStretch[g].at <= i) {
        shift += job.colStretch[g].amount * ratio;
        g += 1;
      }
      if (shift) items[i] = { ...items[i], y: items[i].y - shift };
    }
    job.y -= shift;
    job.colStretch = [];
  }

  /** The column is full: stretch it, then go on to the next column, or to a
   *  new page when this was the last one. */
  function moveOn(job) {
    flushColumn(job);
    if (!job.spanning && job.colIndex + 1 < job.cols) nextColumn(job);
    else startPage(job);
  }

  /** A heading is about to be set. What the page looks like now is kept, so
   *  that if the heading would end a column with nothing under it, it can be
   *  taken back off and set at the top of the next one instead. */
  function startKeep(job) {
    if (job.capture || !job.klassKeeps) return;
    if (!job.page) startPage(job);
    job.keeping = {
      at: job.page.items.length, y: job.y, prevDepth: job.prevDepth,
      firstOnPage: job.firstOnPage, lastSkip: job.lastSkip || 0,
      stretchLen: (job.colStretch || []).length,
      pageIndex: job.pageIndex, col: job.spanning ? 0 : job.colIndex,
      top: job.firstOnPage, rows: [], closed: false,
    };
  }
  const closeKeep = (job) => { if (job.keeping) job.keeping.closed = true; };

  function rollbackKeep(job, keep) {
    job.page.items.length = keep.at;
    job.y = keep.y;
    job.prevDepth = keep.prevDepth;
    job.firstOnPage = keep.firstOnPage;
    job.lastSkip = keep.lastSkip;
    if (job.colStretch) job.colStretch.length = keep.stretchLen;
  }

  /** Leave the columns for a moment and run the full width — a title block, a
   *  teaser figure, a starred float: the three things that are wider than the
   *  column they were written in. */
  function beginSpan(job) {
    if (job.spanning) return null;
    if (!job.page) startPage(job);
    const was = { colIndex: job.colIndex, columnTop: job.columnTop };
    job.spanning = true;
    layout(job);
    return was;
  }

  function endSpan(job, was) {
    if (!was) return;
    job.spanning = false;
    layout(job);
    // Both columns start where the wide block stopped.
    job.columnTop = job.y - job.prevDepth;
    job.colIndex = 0;
    job.y = job.columnTop;
    job.firstOnPage = true;
    job.prevDepth = 0;
    beginColumn(job);
  }

  /** Wide floats wait for the top of a page, which is where a two-column class
   *  puts them. They are already rows by the time they get here. */
  function flushWide(job) {
    if (!job.wide.length || job.flushing || job.spanning) return false;
    const queue = job.wide;
    job.wide = [];
    job.flushing = true;
    const was = beginSpan(job);
    for (const row of queue) {
      emitRow(job, row);
      // \dbltextfloatsep under each wide float, and the columns begin below.
      if (row.wideEnd && job.texSkips) vspace(job, 20 * PT);
    }
    endSpan(job, was);
    job.flushing = false;
    return true;
  }

  const leading = (job) =>
    job.font.leading || job.font.size * (job.leadRatio || 1.2);
  // \lineskip and \lineskiplimit, both 1pt in amsart.
  const LINESKIP = 1;
  const fontKey = (job) => M().key(job.font.family, job.font.bold, job.font.italic);

  function say(job, level, message, line, file) {
    job.log.push({ level, message, line: line || null, file: file || null });
  }

  // ------------------------------------------------------------- pages, rows

  function startPage(job) {
    finishPage(job);
    job.page = job.doc.page(job.W, job.H);
    job.pageIndex += 1;
    // Page one is a right-hand page, so it takes the odd margin.
    if (job.oddLeft !== undefined) job.left = job.pageIndex % 2 === 0 ? job.oddLeft : job.evenLeft;
    job.y = job.H - job.marginTop;
    job.columnTop = job.y;
    job.colIndex = 0;
    job.firstOnPage = true;
    job.prevDepth = 0;
    job.colNotes = Array.from({ length: job.cols }, () => []);
    job.colNoteHeight = Array.from({ length: job.cols }, () => 0);
    job.colStart = job.page.items.length;
    job.colStretch = [];
    // Wide floats first, across the top; the columns begin under them, and
    // endSpan starts the first one. With nothing wide waiting, it starts here.
    if (!flushWide(job)) beginColumn(job);
    return job.page;
  }

  function finishPage(job) {
    if (!job.page) return;
    // The folio, centred under the text block, the way an article sets it.
    // A class that draws its own heads and feet does it in `decorate`.
    if (job.decorate) {
      job.decorate(job);
    } else if (job.folios !== false) {
      const number = String(job.counters.page);
      const size = job.base * 0.9;
      const width = M().width(number, 'rm', size);
      job.page.items.push({
        k: 't', x: (job.W - width) / 2, y: job.marginBottom * 0.5, f: 'rm', s: size, t: number,
      });
    }
    job.counters.page += 1;

    // A note belongs to the column it was called from and is set at the foot
    // of that column, which is the only place a reader looks for it. The rule
    // goes at the top of the strip the column reserved and not a point higher,
    // or it lands on the last line the column was still allowed to set.
    const block = job.bottomBlock;
    const onBlockPage = block && job.pageIndex === block.page;
    job.colNotes.forEach((notes, col) => {
      if (!notes.length) return;
      const floor = job.marginBottom + (onBlockPage && col === block.col ? block.height : 0);
      const top = floor + job.colNoteHeight[col];
      let y = top - job.base * 1.1;
      job.page.items.push({
        k: 'r', x: columnX(job, col), y: top - job.base * 0.5,
        w: Math.min(job.colWidth, job.noteRule || job.colWidth * 0.4), h: 0.4,
      });
      for (const note of notes) y = placeRows(job, note, y + note[0].above, columnX(job, col));
    });

    if (onBlockPage && block.draw) {
      block.draw(columnX(job, block.col));
    } else if (onBlockPage) {
      // The strip the column reserved is `height`; the block sits at the foot
      // of it and the gap is above, which is where the reader needs it. The
      // rule is the class's own: the width of the column.
      const left = columnX(job, block.col);
      const y = job.marginBottom + (block.tall === undefined ? block.height : block.tall);
      job.page.items.push({ k: 'r', x: left, y: y + (block.gap || 0) * 0.42, w: job.colWidth, h: 0.4 });
      placeRows(job, block.rows, y, left);
    }
  }

  /** How far below the last baseline the next one goes — TeX's rule, applied
   *  to a block of rows that was captured rather than placed. */
  const stepFor = (row, prevDepth, first) =>
    (first ? row.above
      : (row.gap || 0) + Math.max(row.leading || 0, prevDepth + row.above + LINESKIP));

  const noteHeightOf = (rows) => {
    let total = 0;
    let prevDepth = 0;
    rows.forEach((row, i) => {
      total += stepFor(row, prevDepth, i === 0);
      prevDepth = row.below;
    });
    return total + prevDepth;
  };

  /** Set a captured block with its top at `top`, and say where it ended. */
  function placeRows(job, rows, top, x) {
    let y = top;
    let prevDepth = 0;
    rows.forEach((row, i) => {
      y -= stepFor(row, prevDepth, i === 0);
      for (const item of row.items) {
        job.page.items.push({ ...item, x: item.x + x + (row.x || 0), y: item.y + y });
      }
      prevDepth = row.below;
    });
    return y - prevDepth;
  }

  function fits(job, need) {
    return job.y - need >= job.marginBottom + reserved(job);
  }

  /** Put one row on the page, starting a new one if it will not go. Rows made
   *  for a footnote or a table cell are captured instead: the same paragraph
   *  machinery, without the page it usually ends on. */
  function emitRow(job, row) {
    if (job.capture) {
      row.leading = leading(job);
      // A skip asked for while capturing rides on the row after it.
      if (job.captureGap) { row.gap = (row.gap || 0) + job.captureGap; job.captureGap = 0; }
      job.capture.push(row);
      return undefined;
    }
    if (!job.page) startPage(job);
    if (row.gap && !job.firstOnPage) job.y -= row.gap;
    const col = job.spanning ? 0 : job.colIndex;
    const extra = row.notes
      ? noteHeightOf(row.notes.flat()) + (job.noteSkip || job.base * 1.2) * (job.colNotes[col].length ? 0 : 1)
      : 0;
    // TeX's rule: put the baseline a \baselineskip below the last one, unless
    // that would leave less than \lineskiplimit of daylight between the two
    // lines, in which case leave \lineskip and let the line grow. The first
    // line of a column sits \topskip below its top, or lower if it is taller.
    const wanted = row.fixedLeading || row.leading || leading(job);
    const daylight = wanted - job.prevDepth - row.above;
    const drop = job.firstOnPage
      ? Math.max(row.above, job.spanning ? 0 : (job.topskip || 0))
      : (daylight >= LINESKIP ? wanted : job.prevDepth + row.above + LINESKIP) + (row.lead || 0);

    // A heading waits for the line after it, and that line for the one after
    // it: \@afterheading forbids a break between them. If the pair will not go
    // here, the heading is taken back off and goes with them.
    const keep = job.keeping;
    const part = keep && !keep.closed;
    const follower = keep && keep.closed;
    const below = job.depthHangs ? 0 : row.below;
    const need = drop + below + extra + (follower ? (row.club || 0) : 0);

    // A frame that cannot hold this row hands it on: to the next column if the
    // page has one, to a new page if it does not. A row taller than a whole
    // frame is set where it is rather than moved for ever.
    if (!fits(job, need) && !job.firstOnPage) {
      if (follower && !keep.top && keep.pageIndex === job.pageIndex && keep.col === col) {
        job.keeping = null;
        rollbackKeep(job, keep);
        moveOn(job);
        for (const held of keep.rows) emitRow(job, held);
        return emitRow(job, row);
      }
      if (follower) job.keeping = null;
      moveOn(job);
      return emitRow(job, row);
    }

    job.y -= drop;
    for (const item of row.items) {
      job.page.items.push({ ...item, x: item.x + frameX(job) + (row.x || 0), y: item.y + job.y });
    }
    job.prevDepth = row.below;
    job.firstOnPage = false;
    job.lastSkip = 0;
    if (part) keep.rows.push({ ...row, fixedLeading: wanted });
    if (follower) job.keeping = null;

    if (row.notes) {
      for (const note of row.notes) {
        job.colNotes[col].push(note);
        job.colNoteHeight[col] += noteHeightOf(note) + (job.colNotes[col].length === 1 ? job.base * 1.2 : 0);
      }
    }
    if (row.mark) row.mark(job.pageIndex, job.y);
    return undefined;
  }

  /** Space asked for by name rather than by what is in it. The depth of the
   *  last row is settled here rather than being carried into the next one,
   *  because after an explicit skip there is no "next row" to settle it. */
  function vspace(job, height, options = {}) {
    if (job.capture) {
      if (job.texSkips && job.capture.length) job.captureGap = (job.captureGap || 0) + height;
      return;
    }
    if (!job.page) startPage(job);
    if (job.firstOnPage) return;
    if (job.texSkips) {
      // TeX's own reckoning, which acmart is measured in: a skip goes between
      // the depth of the line above and the height of the line below, and the
      // baselineskip still applies across it — so the depth is not spent here.
      // \addvspace (sections, lists, displays) takes the larger of two skips
      // in a row rather than their sum.
      let add = height;
      if (options.max) {
        add = Math.max(0, height - (job.lastSkip || 0));
        job.lastSkip = Math.max(job.lastSkip || 0, height);
      } else {
        job.lastSkip = height;
      }
      job.y -= add;
      if (options.stretch && job.flushBottom && !job.spanning && job.colStretch) {
        job.colStretch.push({ at: job.page.items.length, amount: options.stretch });
      }
      return;
    }
    job.y -= job.prevDepth + height;
    job.prevDepth = 0;
  }

  // ------------------------------------------------------- words and glue

  function spaceWidth(job) {
    return M().charWidth(' ', fontKey(job), job.font.size);
  }

  function ensureWord(job) {
    if (!job.word) job.word = { k: 'word', runs: [], w: 0, h: 0, d: 0 };
    return job.word;
  }

  function addRun(job, text, key, size, options = {}) {
    if (!text) return;
    const word = ensureWord(job);
    const last = word.runs[word.runs.length - 1];
    const rise = options.rise || 0;
    const c = options.c || job.colour || null;
    const m = M();
    const joins = last && last.f === key && last.s === size && (last.rise || 0) === rise
      && (last.c || null) === c && !options.link && !last.link;
    if (joins) {
      // The run is measured again rather than added to: "f" and "i" arrive as
      // two characters and leave as one ligature, and a kern lives between a
      // pair rather than in either of them.
      word.w -= m.width(last.t, key, size);
      last.t += text;
      word.w += m.width(last.t, key, size);
    } else {
      word.runs.push({ f: key, s: size, t: text, rise, c, link: options.link || null });
      word.w += m.width(text, key, size);
    }
    word.h = Math.max(word.h, m.ascent(key, size) * 0.95 + rise);
    word.d = Math.max(word.d, m.descent(key, size) - rise);
  }

  function addText(job, text) {
    if (job.upper) {
      addRun(job, text.toUpperCase(), fontKey(job), job.font.size);
      return;
    }
    if (job.font.sc) {
      // Small capitals, as close as base-14 gets: capitals at full size,
      // lower case as capitals at four fifths.
      for (const ch of text) {
        const upper = ch.toUpperCase();
        const small = upper !== ch && /[a-z]/.test(ch);
        addRun(job, upper, fontKey(job), job.font.size * (small ? 0.8 : 1));
      }
      return;
    }
    addRun(job, text, fontKey(job), job.font.size);
  }

  function addBox(job, box, options = {}) {
    endWord(job);
    const items = job.colour
      ? box.items.map((item) => (item.k === 't' || item.k === 'r' ? { ...item, c: item.c || job.colour } : item))
      : box.items;
    job.nodes.push({ k: 'box', w: box.w, h: box.h, d: box.d, items, ...options });
  }

  function endWord(job) {
    if (job.word && job.word.runs.length) job.nodes.push(job.word);
    job.word = null;
  }

  function addGlue(job, options = {}) {
    endWord(job);
    const last = job.nodes[job.nodes.length - 1];
    if (!last || last.k === 'glue') return;
    const w = options.w === undefined ? spaceWidth(job) : options.w;
    job.nodes.push({
      k: 'glue', w,
      stretch: options.stretch === undefined ? w * 0.6 : options.stretch,
      shrink: options.shrink === undefined ? w * 0.32 : options.shrink,
      nobreak: options.nobreak || false,
      fill: options.fill || false,
    });
  }

  // ------------------------------------------------------------ line breaking

  // ------------------------------------------------------------ line breaking
  //
  // Knuth and Plass, which is the difference between a paragraph that fits and
  // a paragraph that reads. Greedy breaking takes the first break that fits and
  // lives with what that does to the next line; this one scores every way of
  // breaking the whole paragraph and takes the cheapest.
  //
  // A line's cost is its badness — how far its spaces had to stretch, cubed, so
  // that one very loose line costs more than two slightly loose ones — plus a
  // penalty for breaking at a hyphen, plus a penalty for a tight line next to a
  // loose one. The cheapest set of breaks is found by keeping, at every
  // breakpoint, the best way of having got there.
  //
  // The numbers are TeX's, which is the point: linepenalty 10, hyphenpenalty
  // 50, adjdemerits 10000, doublehyphendemerits 10000, pretolerance 100,
  // tolerance 200 — or 9999 where the document says \sloppy.

  const INF_PENALTY = 10000;
  const INF_STRETCH = 100000;
  const KP = {
    line: 10,
    hyphen: 50,
    adjacent: 10000,
    doubleHyphen: 10000,
    pretolerance: 100,
    tolerance: 200,
  };

  const badnessOf = (ratio) => {
    if (ratio < -1) return null;
    const badness = 100 * Math.abs(ratio) ** 3;
    return badness > INF_PENALTY ? INF_PENALTY : Math.round(badness);
  };

  const fitnessOf = (ratio) => {
    if (ratio < -0.5) return 0;
    if (ratio <= 0.5) return 1;
    if (ratio <= 1) return 2;
    return 3;
  };

  /** A word split where the patterns say it may be. The pieces are boxes and
   *  the joints are discretionaries, which is how TeX carries a hyphen that
   *  only exists if the line happens to break there. */
  function withDiscretionaries(node) {
    if (node.k !== 'word' || node.runs.length !== 1 || !T.hyphenate) return [node];
    const run = node.runs[0];
    // Linked words hyphenate like any others; a URL never does.
    if ((run.link && run.link.raw) || run.f.startsWith('tt') || run.f === 'sy') return [node];
    const parts = /^([^A-Za-z]*)([A-Za-z]{5,})([^A-Za-z]*)$/.exec(run.t);
    if (!parts) return [node];
    const points = T.hyphenate(parts[2]);
    if (!points.length) return [node];

    const m = M();
    const out = [];
    const cuts = [0, ...points.map((n) => n + parts[1].length), run.t.length];
    for (let i = 0; i < cuts.length - 1; i += 1) {
      if (i) {
        out.push({
          k: 'disc', w: 0, hyphen: m.width('-', run.f, run.s),
          f: run.f, s: run.s, c: run.c || null, rise: run.rise || 0,
        });
      }
      const text = run.t.slice(cuts[i], cuts[i + 1]);
      out.push({
        k: 'word',
        w: m.width(text, run.f, run.s),
        h: node.h, d: node.d,
        runs: [{ ...run, t: text }],
        notes: i === 0 ? node.notes : null,
      });
    }
    return out;
  }

  /** A word with a hyphen or a dash in it may break after that character,
   *  with nothing added — TeX's \exhyphenpenalty, 50, the same price as a
   *  hyphen it had to insert. "camera-ready" and "more—all" break here. */
  function explicitBreaks(node) {
    if (node.k !== 'word' || node.runs.some((run) => run.link && run.link.raw)) return [node];
    const m = M();
    const out = [];
    let pieceRuns = [];
    const flush = () => {
      if (!pieceRuns.length) return;
      const w = pieceRuns.reduce((sum, run) => sum + m.width(run.t, run.f, run.s), 0);
      out.push({ k: 'word', w, h: node.h, d: node.d, runs: pieceRuns, notes: out.length ? null : node.notes });
      pieceRuns = [];
    };
    const total = node.runs.reduce((sum, run) => sum + run.t.length, 0);
    let seen = 0;
    for (const run of node.runs) {
      let from = 0;
      // Typewriter text has no \hyphenchar: "--verbose" stays whole.
      if (run.f.startsWith('tt')) { pieceRuns.push(run); seen += run.t.length; continue; }
      for (let i = 0; i < run.t.length; i += 1) {
        const ch = run.t[i];
        const at = seen + i;
        if ((ch === '-' || ch === '\u2013' || ch === '\u2014') && at > 0 && at < total - 1
          && !(run.t[i + 1] === '-' || run.t[i + 1] === '\u2013' || run.t[i + 1] === '\u2014')) {
          pieceRuns.push({ ...run, t: run.t.slice(from, i + 1) });
          from = i + 1;
          flush();
          out.push({ k: 'disc', w: 0, hyphen: 0, explicit: true });
        }
      }
      if (from < run.t.length) pieceRuns.push({ ...run, t: run.t.slice(from) });
      seen += run.t.length;
    }
    flush();
    return out.length > 1 ? out : [node];
  }

  /** The paragraph as TeX sees it: boxes, glue and penalties. */
  function itemsFor(nodes, hyphenate) {
    const items = [];
    for (const node of nodes) {
      if (node.k === 'break') {
        items.push({ kind: 'penalty', w: 0, p: -INF_PENALTY, flagged: false, node: null });
        continue;
      }
      if (node.k === 'glue') {
        items.push({
          kind: 'glue', w: node.w,
          y: node.fill ? INF_STRETCH : node.stretch,
          z: node.shrink, nobreak: node.nobreak, node,
        });
        continue;
      }
      for (const part of explicitBreaks(node)) {
        for (const piece of (hyphenate && part.k === 'word' ? withDiscretionaries(part) : [part])) {
          if (piece.k === 'disc') items.push({ kind: 'penalty', w: piece.hyphen, p: KP.hyphen, flagged: true, node: piece.explicit ? null : piece });
          else items.push({ kind: 'box', w: piece.w, node: piece });
        }
      }
    }
    // TeX ends a paragraph with \penalty10000 \hfil \penalty-10000, which is
    // what lets the last line be short without being bad.
    items.push({ kind: 'penalty', w: 0, p: INF_PENALTY, flagged: false, node: null });
    items.push({ kind: 'glue', w: 0, y: INF_STRETCH, z: 0, nobreak: false, node: null });
    items.push({ kind: 'penalty', w: 0, p: -INF_PENALTY, flagged: false, node: null });
    return items;
  }

  /** One pass. Returns the chosen breakpoints, or null if no way of breaking
   *  the paragraph stayed inside the tolerance. */
  function tryBreaking(items, widthFor, tolerance, protrusionAt = null, ragged = false) {
    const n = items.length;
    const sumW = new Array(n + 1).fill(0);
    const sumY = new Array(n + 1).fill(0);
    const sumZ = new Array(n + 1).fill(0);
    for (let i = 0; i < n; i += 1) {
      const item = items[i];
      const measured = item.kind === 'glue' || item.kind === 'box';
      sumW[i + 1] = sumW[i] + (measured ? item.w : 0);
      sumY[i + 1] = sumY[i] + (item.kind === 'glue' ? item.y : 0);
      sumZ[i + 1] = sumZ[i] + (item.kind === 'glue' ? item.z : 0);
    }

    const legal = (i) => {
      const item = items[i];
      if (item.kind === 'penalty') return item.p < INF_PENALTY;
      if (item.kind === 'glue') return !item.nobreak && i > 0 && items[i - 1].kind === 'box';
      return false;
    };

    // The glue after a break is discarded, so the next line starts at the first
    // thing that is neither glue nor a penalty.
    const startAfter = (i) => {
      let at = i + (items[i] && items[i].kind === 'penalty' ? 1 : 0);
      while (at < n && (items[at].kind === 'glue' || items[at].kind === 'penalty')) at += 1;
      return at;
    };

    // A paragraph never begins with glue — addGlue refuses to be the first thing
    // in one — so the first line starts at the first item there is.
    let active = [{ position: 0, line: 0, fitness: 1, demerits: 0, previous: null, flagged: false, start: 0 }];

    for (let b = 0; b < n; b += 1) {
      if (!legal(b)) continue;
      const here = items[b];
      const forced = here.kind === 'penalty' && here.p <= -INF_PENALTY;
      const best = new Map();
      const keep = [];

      // microtype's protrusion: a hyphen or a full stop at the end of a line
      // hangs most of its width into the margin, so the line may hold that
      // much more.
      const hang = protrusionAt ? protrusionAt(items, b) : 0;
      for (const node of active) {
        const width = sumW[b] - sumW[node.start] + (here.kind === 'penalty' ? here.w : 0) - hang;
        const stretch = sumY[b] - sumY[node.start];
        const shrink = sumZ[b] - sumZ[node.start];
        const room = widthFor(node.line);
        const slack = room - width;

        let ratio;
        // A line with \parfillskip in it is never loose, but it can still be
        // too wide: then it shrinks like any other, and may not fit at all.
        if (slack < 0 && stretch >= INF_STRETCH) ratio = shrink > 0 ? slack / shrink : -1000;
        else if (stretch >= INF_STRETCH) ratio = 0;
        // \centering and \raggedright put 0pt plus 1fil at the ends of every
        // line, so any line that fits is a perfect one — and the first pass,
        // without hyphens, always succeeds.
        else if (ragged && slack >= 0) ratio = 0;
        else if (slack > 0) ratio = stretch > 0 ? Math.min(slack / stretch, 1000) : 1000;
        else if (slack < 0) ratio = shrink > 0 ? slack / shrink : -1000;
        else ratio = 0;

        const badness = badnessOf(ratio);
        if (badness !== null && badness <= tolerance) {
          const penalty = here.kind === 'penalty' ? here.p : 0;
          let demerits = (KP.line + badness) ** 2;
          if (penalty > 0) demerits += penalty ** 2;
          else if (penalty > -INF_PENALTY) demerits -= penalty ** 2;
          if (here.flagged && node.flagged) demerits += KP.doubleHyphen;
          const fitness = fitnessOf(ratio);
          if (Math.abs(fitness - node.fitness) > 1) demerits += KP.adjacent;
          demerits += node.demerits;

          const found = best.get(fitness);
          if (!found || demerits < found.demerits) {
            best.set(fitness, {
              position: b,
              line: node.line + 1,
              fitness,
              demerits,
              previous: node,
              flagged: !!here.flagged,
              start: startAfter(b),
            });
          }
        }

        // A node stays active while a line from it could still fit. Once the
        // text from it to here cannot be squeezed into the measure, nothing
        // later will fit either.
        if (ratio >= -1 && !forced) keep.push(node);
      }

      active = keep.concat([...best.values()]);
      if (!active.length) return null;
    }

    const ends = active.filter((node) => node.position === n - 1);
    const pool = ends.length ? ends : active.filter((node) => node.position > 0);
    if (!pool.length) return null;
    let chosen = pool[0];
    for (const node of pool) if (node.demerits < chosen.demerits) chosen = node;

    const breaks = [];
    for (let node = chosen; node && node.previous; node = node.previous) breaks.unshift(node);
    if (protrusionAt) for (const stop of breaks) stop.hang = protrusionAt(items, stop.position);
    return breaks;
  }

  /** Cut the node list at the chosen breakpoints. */
  function linesFrom(items, breaks) {
    const lines = [];
    for (const stop of breaks) {
      const line = [];
      for (let i = stop.previous.start; i < stop.position; i += 1) {
        const item = items[i];
        if (item.kind !== 'penalty' && item.node) line.push(item.node);
      }
      while (line.length && line[line.length - 1].k === 'glue') line.pop();
      const here = items[stop.position];
      if (here.flagged && here.node) {
        // The hyphen exists only because the line broke here.
        line.push({
          k: 'word', w: here.w, h: 0, d: 0,
          runs: [{ f: here.node.f, s: here.node.s, t: '-', rise: here.node.rise, c: here.node.c, link: null }],
        });
      }
      if (here.kind === 'penalty' && here.p <= -INF_PENALTY) line.forced = true;
      line.hang = stop.hang || 0;
      lines.push(line);
    }
    while (lines.length > 1 && !lines[lines.length - 1].length) lines.pop();
    return lines;
  }

  /** First fit, for when nothing else will do: a paragraph holding a word
   *  longer than the measure has no feasible breaking and still has to be set. */
  function firstFit(nodes, measure, job) {
    const lines = [];
    let line = [];
    let width = 0;
    let lastGlue = -1;

    const flush = (upto, next) => {
      const take = line.slice(0, upto);
      while (take.length && take[take.length - 1].k === 'glue') take.pop();
      lines.push(take);
      line = line.slice(next);
      width = line.reduce((sum, node) => sum + node.w, 0);
      lastGlue = -1;
      for (let i = line.length - 1; i >= 0; i -= 1) if (line[i].k === 'glue' && !line[i].nobreak) { lastGlue = i; break; }
    };

    for (const node of nodes) {
      if (node.k === 'break') {
        line.push(node);
        flush(line.length, line.length);
        lines[lines.length - 1].forced = true;
        continue;
      }
      if (node.k === 'glue' && !line.length) continue;
      line.push(node);
      width += node.w;
      if (node.k === 'glue' && !node.nobreak) lastGlue = line.length - 1;

      if (width > measure + 0.01) {
        if (lastGlue > 0) {
          flush(lastGlue, lastGlue + 1);
        } else if (line.length > 1) {
          const overflow = width - node.w - measure;
          if (overflow > 0.1 && job) {
            say(job, 'warning', `Overfull line by ${Math.round(overflow)}pt`, job.line, job.file);
          }
          flush(line.length - 1, line.length - 1);
        }
      }
    }
    while (line.length && line[line.length - 1].k === 'glue') line.pop();
    if (line.length) lines.push(line);
    return lines;
  }

  /** Break a paragraph. `widthFor(n)` is how wide the nth line may be, because
   *  that is not one number when the first line is indented. */
  // microtype's default protrusion, in thousandths of the character's own
  // width: how far each hangs past the right edge of a justified line.
  const PROTRUDE = {
    '-': 700, '.': 700, ',': 700, ':': 500, ';': 500, '!': 200, '?': 200,
    '\u2019': 700, '\u201d': 700, ')': 50, '\u2013': 300, '\u2014': 200, '\'': 700, '"': 500,
  };

  function protrusionOf(items, b) {
    const here = items[b];
    if (!here) return 0;
    if (here.kind === 'penalty' && here.flagged && here.node && here.w) return here.w * (PROTRUDE['-'] / 1000);
    if (here.kind === 'penalty' && here.flagged && !here.node) {
      const before = items[b - 1];
      return before && before.kind === 'box' ? lastHang(before.node) : 0;
    }
    if (here.kind !== 'glue' && here.kind !== 'penalty') return 0;
    const before = items[b - 1];
    return before && before.kind === 'box' ? lastHang(before.node) : 0;
  }

  function lastHang(node) {
    if (!node || node.k !== 'word' || !node.runs.length) return 0;
    const run = node.runs[node.runs.length - 1];
    if (!run.t || run.f === 'sy' || run.f.startsWith('tt') || run.rise) return 0;
    const ch = run.t[run.t.length - 1];
    const factor = PROTRUDE[ch];
    return factor ? M().charWidth(ch, run.f, run.s) * (factor / 1000) : 0;
  }

  function breakLines(nodes, measure, job, options = {}) {
    const widthFor = options.widthFor || (() => measure);
    const tolerance = (job && job.tolerance) || KP.tolerance;
    const hang = job && job.protrusion && options.justify !== false ? protrusionOf : null;
    const ragged = !!(job && job.klass === 'acm' && options.justify === false);
    // With fil glue at both ends every break that fits costs nothing, and
    // what TeX sets is each line filled as far as it goes: a title or a
    // heading breaks late, and never needs a hyphen to do it.
    if (ragged) return firstFit(nodes, widthFor(0), job);

    // TeX's first pass does not hyphenate: a paragraph that reads well without
    // hyphens should not be given any.
    for (const [hyphenate, limit] of [[false, KP.pretolerance], [true, tolerance]]) {
      const items = itemsFor(nodes, hyphenate);
      const breaks = tryBreaking(items, widthFor, limit, hang, ragged);
      if (breaks && breaks.length) return linesFrom(items, breaks);
    }
    // TeX would set an overfull line here and say so. A line that runs into
    // the next column is worse to look at than a loose one, so a last pass
    // takes any breaking at all that keeps every line inside the measure.
    const items = itemsFor(nodes, true);
    const loose = tryBreaking(items, widthFor, INF_PENALTY, hang);
    if (loose && loose.length) return linesFrom(items, loose);
    return firstFit(nodes, widthFor(0), job);
  }

  /** A broken line becomes a row: items placed at their final x, and the
   *  spaces stretched if the line is being justified. */
  function lineRow(job, line, measure, { justify, align, indent = 0 }) {
    const natural = line.reduce((sum, node) => sum + node.w, 0);
    const glues = line.filter((node) => node.k === 'glue' && !node.fill);
    const fills = line.filter((node) => node.k === 'glue' && node.fill);
    const slack = measure - indent - natural + (justify ? (line.hang || 0) : 0);

    let stretchPer = 0;
    let fillPer = 0;
    if (fills.length) {
      fillPer = slack / fills.length;
    } else if (justify && slack > 0 && glues.length) {
      const total = glues.reduce((sum, glue) => sum + glue.stretch, 0);
      stretchPer = total > 0 ? slack / total : 0;
    } else if (slack < 0 && glues.length) {
      const total = glues.reduce((sum, glue) => sum + glue.shrink, 0);
      stretchPer = total > 0 ? Math.max(-1, slack / total) : 0;
    }

    let x = indent;
    if (!justify && !fills.length) {
      if (align === 'center') x += Math.max(0, slack) / 2;
      else if (align === 'right') x += Math.max(0, slack);
    }

    const items = [];
    let above = 0;
    let below = 0;
    const notes = [];

    for (const node of line) {
      if (node.k === 'glue') {
        x += node.w + (node.fill ? fillPer : (stretchPer ? (slack > 0 ? node.stretch : node.shrink) * stretchPer : 0));
        continue;
      }
      if (node.k === 'break') continue;
      if (node.k === 'word') {
        let at = x;
        for (const run of node.runs) {
          items.push({ k: 't', x: at, y: run.rise || 0, f: run.f, s: run.s, t: run.t, c: run.c || undefined });
          const w = M().width(run.t, run.f, run.s);
          if (run.link) {
            items.push({ k: 'l', x: at, y: -run.s * 0.22, w, h: run.s * 1.02, url: run.link.url, page: run.link.page, tx: run.link.tx, ty: run.link.ty });
          }
          at += w;
        }
        above = Math.max(above, node.h);
        below = Math.max(below, node.d);
        if (node.notes) notes.push(...node.notes);
        x += node.w;
        continue;
      }
      if (node.k === 'box') {
        for (const item of node.items) items.push({ ...item, x: item.x + x, y: item.y });
        above = Math.max(above, node.h);
        below = Math.max(below, node.d);
        if (node.notes) notes.push(...node.notes);
        x += node.w;
      }
    }

    return {
      items,
      above: above || job.font.size * 0.75,
      below,
      x: job.leftSkip,
      notes: notes.length ? notes : null,
    };
  }

  /** End the paragraph being built and put its lines on the page. */
  function endParagraph(job, options = {}) {
    endWord(job);
    // A run-in heading waits for its paragraph: the blank line under
    // \subsubsection{…} does not end anything, because nothing has begun.
    if (job.runInCount && job.nodes.length <= job.runInCount && !options.force) return;
    job.runInCount = 0;
    const nodes = job.nodes;
    job.nodes = [];
    if (!nodes.length) return;

    const measure = job.measure - job.leftSkip - job.rightSkip;
    const indent = options.indent === undefined
      ? (job.parindent && job.align === 'justify' ? (job.parIndent || job.font.size * 1.5) : 0)
      : options.indent;
    const hanging = options.hanging || 0;

    // Only the first line is indented, so only the first line is that much
    // narrower. Breaking every line at the indented measure — which is what
    // this did — made every line after the first too short and then justified
    // it to the full width, which is where the gappy spacing came from.
    const lines = breakLines(nodes, measure, job, {
      widthFor: (n) => measure - (n === 0 ? indent : hanging),
      justify: job.align === 'justify',
    });
    lines.forEach((line, i) => {
      const first = i === 0;
      const last = i === lines.length - 1 || line.forced;
      const row = lineRow(job, line, measure, {
        justify: job.align === 'justify' && !last,
        align: job.align === 'justify' ? 'left' : job.align,
        indent: first ? indent : hanging,
      });
      row.x = job.leftSkip;
      // The first line of a paragraph says how much room the second needs, so
      // a heading above it can insist on both.
      if (first && lines.length > 1) row.club = leading(job);
      if (options.keep && i === lines.length - 1) row.keep = true;
      if (options.mark && first) row.mark = options.mark;
      emitRow(job, row);
    });
    job.parindent = true;
  }
