<!doctype html>
<html lang="en" data-marble="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="marble:capabilities" content="storage; net=none">
<title>__TITLE__</title>
__ICON__
<style>
  /* A LaTeX project, as one file.

     The layout is the one every TeX editor has settled on — files at the left,
     source in the middle, the paper at the right — because it is the one that
     lets you watch a change land. What is different here is where the pieces
     live: the source is markup in this file, the engine is one of the scripts in it,
     and the PDF is the only thing that is neither, because a PDF is a
     rendering of a source and this document keeps sources.

     The palette is Marble's. One dusty blue does the accenting; the desk behind
     the PDF is the only grey, because that is the one place where a page has to
     look like a page sitting on something. */
  :root {
    --ink: #111111;
    --muted: #5a5a5a;
    --faint: #8a8a8a;
    --line: #ddd9cf;
    --paper: #ffffff;
    --chrome: #fbfaf7;
    --card: #ffffff;
    --accent: #9bb6cf;
    --accent-soft: #f1f5f8;
    --accent-ink: #738698;
    --desk: #6f7378;
    --ok: #4b7f52;
    --warn: #9a7a3a;
    --bad: #b4544f;
    --radius: 4px;
    --rail: 13rem;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* The laid-out view reads like a manuscript, so it is set in a serif; its
       mathematics borrows whatever math face the reader has. */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, Cambria, "Times New Roman", serif;
    --math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "TeX Gyre Termes Math", var(--serif);
    /* the ease-out the laid-out view morphs on, between rendered and source */
    --morph: 260ms cubic-bezier(.16, 1, .3, 1);
    --code: 12.5px;
    --leading: 1.55;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e6e1; --muted: #a3a7ab; --faint: #7d8288; --line: #2f3438;
      --paper: #1c1f22; --chrome: #191c1f; --card: #1c1f22;
      --accent: #7fa8c9; --accent-soft: #1d2932; --accent-ink: #9dc0dc;
      --desk: #303438; --ok: #7fb489; --warn: #cfae7f; --bad: #e08c88;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/1.5 var(--ui); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ----------------------------------------------------------------- shell */

  .app {
    height: 100vh; height: 100dvh; display: grid;
    grid-template-rows: 2.9rem minmax(0, 1fr) auto;
  }
  .main {
    display: grid; min-height: 0; overflow: hidden;
    grid-template-columns: var(--rail) var(--split, 46%) minmax(0, 1fr);
    /* One row, and it is the height of the grid rather than of what is in it.
       Without this the panes report their content height as their minimum, the
       row grows past the window, and every scroller inside them stops
       scrolling because nothing is ever too tall for its box. */
    grid-template-rows: minmax(0, 1fr);
  }
  .main > * { min-height: 0; min-width: 0; }
  /* Three views of the same project. "split" is the grid as declared; the
     other two give one pane the whole width and take the other out of the
     grid — display:none so it cannot be tabbed into, and a zero track so the
     column it held cannot keep a sliver. */
  .app[data-layout="editor"] .main { grid-template-columns: var(--rail) minmax(0, 1fr) 0; }
  .app[data-layout="pdf"]    .main { grid-template-columns: var(--rail) 0 minmax(0, 1fr); }
  .app[data-layout="editor"] .pdfpane,
  .app[data-layout="pdf"] .editorpane { display: none; }
  .app[data-rail="closed"] { --rail: 0px; }
  .app[data-rail="closed"] .rail { display: none; }

  /* --------------------------------------------------------------- the bar */

  .bar {
    display: flex; align-items: center; gap: .35rem; padding: 0 .55rem;
    border-bottom: 1px solid var(--line); background: var(--chrome);
  }
  .brand { display: flex; align-items: center; gap: .45rem; min-width: 0; }
  .brand .dot {
    width: .7rem; height: .7rem; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 32% 30%, #ffffff 0 8%, var(--accent) 42%, var(--accent-ink) 100%);
  }
  .title {
    font-weight: 600; font-size: .85rem; letter-spacing: -.005em;
    padding: .15rem .3rem; border-radius: var(--radius); outline: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22rem;
  }
  .kind { color: var(--faint); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
  .acts { display: flex; align-items: center; gap: .35rem; margin-left: auto; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: .25rem 0; }
  .acts::-webkit-scrollbar { display: none; }

  .btn {
    appearance: none; display: inline-flex; align-items: center; gap: .35rem;
    padding: .3rem .6rem; border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--muted);
    font: 500 .76rem/1.35 var(--ui); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { color: var(--accent-ink); border-color: var(--accent); }
  .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .btn.go { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
  .btn.go:hover { filter: brightness(1.08); color: #fff; }
  .btn.go[data-busy="1"] { opacity: .55; }
  .btn .ico { font-size: .8em; opacity: .9; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .seg .btn { border: 0; border-radius: 0; padding: .3rem .5rem; }
  .seg .btn + .btn { border-left: 1px solid var(--line); }

  /* -------------------------------------------------------------- the rail */

  .rail {
    border-right: 1px solid var(--line); background: var(--chrome);
    overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  }
  .railscroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .rail h2 {
    margin: 0; padding: .7rem .75rem .35rem; font-size: .68rem; letter-spacing: .09em;
    text-transform: uppercase; color: var(--faint); font-weight: 600;
  }
  .filelist { list-style: none; margin: 0; padding: 0 .35rem .35rem; }
  .frow {
    display: flex; align-items: center; gap: .35rem; padding: .26rem .4rem;
    border-radius: var(--radius); cursor: default; color: var(--muted);
    font-size: .78rem; white-space: nowrap; touch-action: none;
    padding-left: calc(.4rem + var(--depth, 0) * .8rem);
    user-select: none; -webkit-user-select: none;
  }
  .frow:hover { background: var(--accent-soft); }
  /* While a row is being carried, nothing on the page is text to select and
     the cursor says so. */
  body.marble-dragging, body.marble-dragging * { user-select: none !important; -webkit-user-select: none !important; cursor: grabbing !important; }
  /* The folder a drop would land in, and the whole list when that is the top. */
  .frow.marble-drop { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-ink); }
  .filelist.marble-drop-top { box-shadow: inset 0 0 0 2px var(--accent); border-radius: var(--radius); }
  .frow.marble-open { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .frow .glyph { width: 1rem; text-align: center; opacity: .65; font-size: .78em; flex: none; }
  .frow .fn { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .frow .more {
    opacity: 0; border: 0; background: none; color: inherit; cursor: pointer;
    font: inherit; padding: 0 .25rem; border-radius: 3px; flex: none;
  }
  .frow:hover .more, .frow .more[aria-expanded="true"] { opacity: .55; }
  .frow .more:hover { opacity: 1; color: var(--accent-ink); background: var(--card); }
  .frow.dir > .fn { font-weight: 600; }
  .frow.dir .glyph { transition: transform .12s ease; }
  .frow.dir.marble-shut .glyph { transform: rotate(-90deg); }

  /* Dragging a file into a folder is a rename. What the drag draws is the thing
     in your hand and the name of the folder it would land in — not a box around
     the row underneath, which is a second thing to read and says less. */
  .frow.marble-lift { opacity: .4; }
  .ghost {
    position: fixed; z-index: 60; pointer-events: none;
    display: flex; align-items: center; gap: .4rem;
    padding: .22rem .5rem; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--accent);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    font: .78rem/1.4 var(--ui); color: var(--ink); white-space: nowrap;
    transform: translate(.6rem, .4rem);
  }
  .ghost .into { color: var(--accent-ink); }
  .ghost .into.nowhere { color: var(--faint); }
  .ren {
    flex: 1 1 auto; min-width: 0; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--accent); border-radius: 3px;
    padding: .05rem .2rem; outline: none;
    user-select: text; -webkit-user-select: text;
  }

  /* The row menu. Fixed, because the rail scrolls and a menu that scrolls with
     it is a menu that leaves the window. */
  .menu {
    position: fixed; z-index: 40; min-width: 9.5rem; padding: .25rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .16); display: grid; gap: 1px;
  }
  .menu[hidden] { display: none; }
  .menu button {
    appearance: none; border: 0; background: none; color: var(--muted);
    font: .78rem/1.5 var(--ui); text-align: left; padding: .3rem .5rem;
    border-radius: 4px; cursor: pointer;
  }
  .menu button:hover { background: var(--accent-soft); color: var(--accent-ink); }
  .menu button[data-do="delete"]:hover { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: .2rem .3rem; }

  /* A folder has no source, so what it shows is what it is. */
  .dirnote {
    flex: 1 1 auto; display: grid; place-content: center; gap: .3rem; text-align: center;
    color: var(--faint); font-size: .8rem; padding: 2rem;
  }
  .railfoot { margin-top: auto; padding: .5rem .6rem; border-top: 1px solid var(--line); display: grid; gap: .35rem; }
  .railnote { font-size: .68rem; line-height: 1.5; color: var(--faint); padding: 0 .75rem .6rem; }

  /* ------------------------------------------------------------ the editor */

  .editorpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
  .sheets { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .file { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  .file.marble-open { display: flex; }
  .fhead {
    display: flex; align-items: baseline; gap: .5rem; padding: .35rem .6rem .35rem 3.6rem;
    border-bottom: 1px solid var(--line); background: var(--chrome);
  }
  .fname {
    margin: 0; font: 600 .76rem/1.4 var(--mono); color: var(--muted);
    padding: .1rem .25rem; border-radius: 3px; outline: none;
  }
  .fmeta { font: .68rem/1.4 var(--mono); color: var(--faint); }

  .codewrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--paper); }
  .codebox { position: relative; min-height: 100%; }
  .src, .hl {
    margin: 0; padding: .55rem .9rem 40vh 3.6rem;
    font: var(--code)/var(--leading) var(--mono);
    white-space: pre-wrap; overflow-wrap: break-word; tab-size: 2;
    font-kerning: none; font-variant-ligatures: none; font-synthesis: none;
    font-feature-settings: "liga" 0, "clig" 0, "calt" 0;
    text-align: left; text-indent: 0; letter-spacing: normal; word-spacing: normal;
  }
  .hl { position: absolute; inset: 0; pointer-events: none; user-select: none; color: var(--ink); }
  .src { position: relative; color: transparent; caret-color: var(--accent-ink); outline: none; background: none; }
  .src::selection { background: rgba(155, 182, 207, .38); }
  .hl .ln { display: block; position: relative; min-height: calc(var(--code) * var(--leading)); }
  .hl .ln > .n {
    position: absolute; left: -2.9rem; width: 2.3rem; text-align: right;
    color: var(--faint); opacity: .55; font-style: normal; user-select: none;
  }
  .hl .ln.marble-hot { background: var(--accent-soft); box-shadow: -3.6rem 0 0 var(--accent-soft), .9rem 0 0 var(--accent-soft); }
  /* Which line the caret is on. Derived from the selection, so it belongs to
     the page and never to the file. */
  .hl .ln.marble-caret > .n { opacity: 1; color: var(--accent-ink); font-weight: 600; }
  .hl .cs   { color: #2f6f9f; }
  .hl .arg  { color: #6f4b8f; }
  .hl .mth  { color: #8a5a2b; }
  /* Not italic, however much a comment wants to be: an italic advance width is
     a different advance width, and the caret is positioned by the pane over
     this one, which is not italic. */
  .hl .com  { color: var(--faint); }
  .hl .brc  { color: var(--accent-ink); }
  .hl .num  { color: #7a6a3a; }
  @media (prefers-color-scheme: dark) {
    .hl .cs { color: #86b8dd; } .hl .arg { color: #c2a4de; } .hl .mth { color: #dcae7d; }
    .hl .num { color: #cbbd8a; } .src::selection { background: rgba(127, 168, 201, .3); }
  }

  /* The divider between the source and the paper. Dragging it is an edit like
     any other: it moves the panes and it writes one custom property. */
  .grabber { position: absolute; top: 0; right: -3px; bottom: 0; width: 6px; cursor: col-resize; z-index: 4; }
  .grabber:hover, .grabber[data-dragging="1"] { background: var(--accent); }
  .app[data-layout="editor"] .grabber, .app[data-layout="pdf"] .grabber { display: none; }

  .shot { padding: 1rem; overflow: auto; background: var(--paper); flex: 1 1 auto; min-height: 0; }
  .shot img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius); }

  /* --------------------------------------------------------------- the pdf */

  .pdfpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--desk); }
  .pdfbar {
    display: flex; align-items: center; gap: .35rem; padding: .25rem .45rem;
    background: var(--chrome); border-bottom: 1px solid var(--line);
  }
  .pdfbar .btn { padding: .22rem .45rem; font-size: .72rem; }
  .pdfnote { font: .7rem/1.4 var(--mono); color: var(--faint); padding-left: .2rem; }
  .viewer { flex: 1 1 auto; min-height: 0; position: relative; }
  .viewer iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--desk); }
  .curtain {
    position: absolute; inset: 0; display: grid; place-content: center; gap: .4rem; text-align: center;
    color: #e2e4e7; font-size: .78rem; background: var(--desk); padding: 2rem;
  }
  .curtain[hidden] { display: none; }
  .curtain .big { font-size: 1.5rem; opacity: .55; }

  /* --------------------------------------------------------------- the log */

  .logpane { border-top: 1px solid var(--line); background: var(--chrome); display: flex; flex-direction: column; }
  .loghead {
    display: flex; align-items: center; gap: .5rem; padding: .3rem .6rem;
    font: .72rem/1.5 var(--ui); color: var(--muted); cursor: pointer; user-select: none;
  }
  .loghead .pill {
    font: 600 .66rem/1 var(--mono); letter-spacing: .04em; padding: .24rem .42rem;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .loghead .pill[data-state="ok"]   { color: var(--ok);   border-color: var(--accent); }
  .loghead .pill[data-state="warn"] { color: var(--warn); border-color: var(--warn); }
  .loghead .pill[data-state="bad"]  { color: var(--bad);  border-color: var(--bad); }
  .logbody { display: none; max-height: 12rem; overflow: auto; padding: 0 0 .4rem; }
  .app[data-log="open"] .logbody { display: block; }
  .app[data-log="open"] .loghead .chev { transform: rotate(180deg); }
  .loghead .chev { transition: transform .15s ease; opacity: .5; display: inline-block; margin-left: auto; }
  .logline {
    display: grid; grid-template-columns: 5.5rem 1fr; gap: .5rem; align-items: baseline;
    padding: .16rem .6rem; font: .72rem/1.5 var(--mono); color: var(--muted);
  }
  .logline:hover { background: var(--accent-soft); }
  .logline .at { color: var(--accent-ink); text-align: right; cursor: pointer; }
  .logline[data-level="error"] .what { color: var(--bad); }
  .logline[data-level="warning"] .what { color: var(--warn); }

  /* --------------------------------------------------------- the laid-out view
     A second way of looking at the open file. It shares the editor pane with
     the source: one `data-view` on the shell says which is shown, so switching
     costs the file nothing. Every row is one line of the source — numbered
     down the same gutter, so a compiler complaint still points somewhere. */

  .richdoc { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; background: var(--paper); }
  .app[data-view="rich"] .sheets { display: none; }
  .app[data-view="rich"] .richdoc { display: flex; }
  .app[data-view="source"] .richdoc { display: none; }

  .richhead {
    display: flex; align-items: center; gap: .6rem; padding: .3rem .6rem .3rem 3.4rem;
    border-bottom: 1px solid var(--line); background: var(--chrome); flex: none;
  }
  .richhead .rname { font: 600 .76rem/1.4 var(--mono); color: var(--muted); }
  .richhead .rmeta { font: .68rem/1.4 var(--mono); color: var(--faint); }
  .richviews { margin-left: auto; display: flex; align-items: center; gap: .35rem; }
  .richviews .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .richviews .seg .btn { border: 0; border-radius: 0; padding: .26rem .5rem; }
  .richviews .seg .btn + .btn { border-left: 1px solid var(--line); }

  .richnote {
    max-width: 32rem; margin: 4rem auto; padding: 0 1.5rem; text-align: center;
    color: var(--faint); font-size: .85rem; line-height: 1.7;
  }
  .richscroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .richpage {
    max-width: 44rem; margin: 0 auto; padding: 2.6rem 2.6rem 45vh;
    position: relative; counter-reset: rl;
  }

  /* One source line. At rest the command syntax is folded to nothing and the
     values render in its place; the line the caret is in unfolds — smoothly —
     to its exact source. The row's *text* is the source line either way,
     which is what lets the whole page be one contenteditable. */
  #richpage { outline: none; caret-color: var(--accent-ink); }
  .rline {
    display: block; position: relative; min-height: 1.75em;
    font: 15px/1.75 var(--serif); color: var(--ink);
    white-space: pre-wrap; overflow-wrap: break-word; tab-size: 2;
    padding: .05em .25rem; border-radius: 3px;
    transition: background 160ms ease, margin var(--morph), padding var(--morph);
  }
  .rline::before {
    counter-increment: rl; content: counter(rl);
    position: absolute; left: -2.7rem; width: 2.1rem; text-align: right;
    font: 10.5px/1.9 var(--mono); color: var(--faint); opacity: .4;
    user-select: none; -webkit-user-select: none; pointer-events: none;
    transition: opacity 160ms ease, color 160ms ease;
  }
  .rline[data-here] { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
  .rline[data-here]::before { opacity: 1; color: var(--accent-ink); font-weight: 600; }
  .rline.marble-hot { background: var(--accent-soft); box-shadow: -2.7rem 0 0 var(--accent-soft); }
  #richpage ::selection { background: rgba(155, 182, 207, .38); }
  @media (prefers-color-scheme: dark) { #richpage ::selection { background: rgba(127, 168, 201, .32); } }

  /* --- the fold ------------------------------------------------------------
     .mk is the command scaffolding (backslash, braces, \begin{…}); .ck is a
     key inside a reference (the cite key, the label). Both fold to zero width
     everywhere, and unfold only on the caret's line, easing open. */
  .rline .mk, .rline .ck {
    font-family: var(--mono); font-size: 0; letter-spacing: -.02em;
    color: var(--accent-ink); opacity: 0;
    transition: font-size var(--morph), opacity 180ms ease;
  }
  .rline[data-here] .mk { font-size: .8em; opacity: .42; }
  .rline[data-here] .ck { font-size: 1em; opacity: .7; }

  /* --- resolved values --------------------------------------------------
     A construct with a value renders it on ::after; the folded source sits
     inside at zero width. On the caret's line the value fades out as the
     source fades in. */
  .rline .cx::after, .rline .rx::after, .rline .ux::after, .rline .mx::after, .rline .lx::after, .rline .fx::after {
    opacity: 1; transition: opacity 160ms ease, font-size var(--morph);
    white-space: nowrap;
  }
  .rline[data-here] .cx::after, .rline[data-here] .rx::after, .rline[data-here] .ux::after,
  .rline[data-here] .mx::after, .rline[data-here] .lx::after, .rline[data-here] .fx::after {
    opacity: 0; font-size: 0;
  }
  .rline .cx::after { content: attr(data-v); color: var(--accent-ink); font: 600 .86em/1 var(--ui); vertical-align: .04em; }
  .rline .rx::after { content: attr(data-v); color: var(--accent-ink); }
  .rline .ux::after { content: attr(data-v); color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .rline .lx::after { content: "⚓"; color: var(--faint); font-size: .74em; opacity: .5; }
  .rline .fx::after { content: attr(data-v); color: var(--accent-ink); font-size: .72em; vertical-align: super; }
  .rline .cx, .rline .rx, .rline .ux, .rline .lx, .rline .fx { cursor: text; }
  .rline .cx:hover::after, .rline .rx:hover::after, .rline .ux:hover::after { text-decoration-line: underline; }

  /* macros: \SystemName → its value; \todo{x} → x, kept editable and styled */
  .rline .mx::after { content: attr(data-v); }
  .rline .mx[data-mc~="rb"]::after { font-weight: 700; }
  .rline .mx[data-mc~="ri"]::after { font-style: italic; }
  .rline .mx[data-mc~="rsc"]::after { font-variant: small-caps; letter-spacing: .02em; }
  .rline .mx[data-mc~="rtt"]::after { font-family: var(--mono); font-size: .92em; }
  .rline .mx1 > .ma { transition: color 160ms ease; }
  .rline .mx1::before { content: attr(data-before); color: var(--muted); }
  .rline .mx1::after { content: attr(data-after); color: var(--muted); }
  .rline[data-here] .mx1::before, .rline[data-here] .mx1::after { content: ""; }
  .rline .qx > .qq::before { content: "“"; } .rline .qx > .qq::after { content: "”"; }
  .rline[data-here] .qx > .qq::before, .rline[data-here] .qx > .qq::after { content: ""; }

  /* Headings — their size at rest and with the caret in them; only the faint
     \section{ } eases in around the title, which does not move. */
  .rline .rh { font-family: var(--serif); font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
  .rline .rh[data-lvl="1"] { font-size: 1.7em; }
  .rline .rh[data-lvl="2"] { font-size: 1.34em; }
  .rline .rh[data-lvl="3"] { font-size: 1.14em; }
  .rline .rh[data-lvl="4"], .rline .rh[data-lvl="5"] { font-size: 1em; text-transform: uppercase; letter-spacing: .04em; }
  .rline.rhead { margin-top: .85em; }

  /* Inline marks. */
  .rline .rb { font-weight: 700; }
  .rline .ri { font-style: italic; }
  .rline .rtt { font-family: var(--mono); font-size: .92em; }
  .rline .ru { text-decoration: underline; text-underline-offset: 2px; }
  .rline .rsc { font-variant: small-caps; letter-spacing: .02em; }

  /* Lists. The marker is a pseudo-element in the gutter — never part of the
     text — and the depth comes from the environment stack, not indentation. */
  .rline.ritem { padding-left: 1.5rem; }
  .rline.ritem::after {
    content: attr(data-mark); position: absolute; left: .3rem; top: .05em;
    color: var(--accent-ink); font-size: .9em; font-family: var(--serif);
    user-select: none; pointer-events: none;
  }
  .rline.ritem[data-depth="1"] { padding-left: 2.7rem; }
  .rline.ritem[data-depth="1"]::after { left: 1.5rem; }
  .rline.ritem[data-depth="2"] { padding-left: 3.9rem; }
  .rline.ritem[data-depth="2"]::after { left: 2.7rem; }

  /* Environment delimiters — folded to a faint tick unless the caret is on
     them. A quote/abstract opener folds away to almost nothing. */
  .rline.renv { color: var(--faint); font-size: .62rem; min-height: 1em; opacity: .5; transition: font-size var(--morph), opacity 160ms ease, min-height var(--morph); }
  .rline.renv .name { color: var(--accent-ink); font-family: var(--mono); }
  .rline.renv[data-here] { font-size: 15px; opacity: 1; min-height: 1.75em; }
  .rline.renv.renv-soft { min-height: .5em; opacity: .35; }
  .rline.renv.renv-soft[data-here] { min-height: 1.75em; opacity: 1; }

  /* Quotations and abstracts as real blocks. */
  .rline.rquote { border-left: 2px solid var(--accent); margin-left: -.15rem; padding-left: 1rem; font-style: italic; color: var(--muted); }
  .rline.rabstract { padding: 0 1.2rem; font-size: .95em; color: var(--muted); }

  /* Preamble and other structural lines: folded small; unfold on the caret. */
  .rline.rctl { color: var(--faint); font-size: .68rem; opacity: .6; min-height: 1em; transition: font-size var(--morph), opacity 160ms ease, min-height var(--morph); }
  .rline.rctl[data-here] { font-size: 15px; opacity: 1; min-height: 1.75em; }
  .rline.rverb { font-family: var(--mono); font-size: .9em; color: var(--muted); }

  /* Mathematics. A displayed line draws as maths while the caret is elsewhere
     (it has an .rmi child then); with the caret on it, it is its own source,
     left-aligned like every other line. */
  .rline.rmath { font-family: var(--math); }
  .rline.rmath:not(:has(.rmi)) { font-family: var(--serif); }
  .rline.rmath .rmi { display: block; text-align: center; font-size: 1.05em; margin: .15em 0; }
  .rline.rmath.delim { color: var(--faint); font: .72rem/1.7 var(--mono); letter-spacing: .06em; }
  .rline .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .88em; margin: 0 .12em; }
  .rline .frac > .fn { border-bottom: 1px solid currentColor; padding: 0 .3em .04em; }
  .rline .frac > .fd { padding: .04em .3em 0; }
  .rline .rad { margin-left: .1em; }
  .rline .rsqrt { border-top: 1px solid currentColor; padding: 0 .18em; margin-left: -.06em; }
  .rline .mtx { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 .1em; }
  .rline .mtx .mfence { font-size: 1.6em; opacity: .6; }
  .rline .mtx .mgrid { display: inline-flex; flex-direction: column; padding: 0 .25em; }
  .rline .mtx .mrow { display: flex; justify-content: center; gap: .55em; }
  .rline .mtx .mcell { padding: .05em 0; }
  .rline .op { font-size: 1.15em; vertical-align: -.12em; }

  /* Comments. Dim; a run of them folds into the gap between two lines while
     "% hidden" is on, and the fold is a thing you click to read them. */
  .rline.rcom {
    color: var(--faint); font-style: italic;
    border-left: 2px solid var(--line); margin-left: -.7rem; padding-left: .45rem;
  }
  .rline.rcom[data-fold] { display: none; }
  .rline.rcom[data-peek] { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }

  .richgap {
    display: block; position: relative; height: 0; margin: .9em 0 1.1em;
    border-top: 1px dashed var(--line); cursor: pointer; user-select: none;
  }
  .richgap::before {
    content: attr(data-label); position: absolute; left: .2rem; top: -.72em;
    font: 10px/1.4 var(--mono); color: var(--faint);
    background: var(--paper); padding: 0 .5em; white-space: nowrap;
  }
  .richgap:hover::before { color: var(--accent-ink); }
  .richgap:hover { border-top-color: var(--accent); }

  /* Collapsed section: the rows are display:none, the heading says so. */
  .rline[data-cfold] { display: none; }
  .rline.rhead[data-collapsed]::after {
    content: " ▸ " attr(data-hidden) " lines"; color: var(--faint);
    font: 400 .62em/1 var(--ui); letter-spacing: .02em; vertical-align: .3em;
    margin-left: .5em;
  }

  /* Floating chrome for the rendered view — never inside the contenteditable. */
  .rich-pill, .rich-fold {
    position: fixed; z-index: 55; display: grid; place-items: center;
    font: 600 .66rem/1 var(--mono); color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; user-select: none; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    opacity: 0; animation: rich-in 140ms cubic-bezier(.16,1,.3,1) forwards;
  }
  .rich-pill { width: 2rem; height: 1.5rem; }
  .rich-fold { width: 1.3rem; height: 1.3rem; font-size: .7rem; border-radius: 4px; box-shadow: none; background: transparent; border-color: transparent; color: var(--faint); }
  .rich-pill:hover { color: var(--accent-ink); border-color: var(--accent); }
  .rich-fold:hover { color: var(--accent-ink); background: var(--accent-soft); }
  @keyframes rich-in { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  .citetip {
    position: fixed; z-index: 56; max-width: 20rem; padding: .5rem .6rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0,0,0,.18); font: 12px/1.5 var(--ui); color: var(--ink);
    opacity: 0; animation: rich-in 140ms cubic-bezier(.16,1,.3,1) forwards;
  }
  .citetip .ct-entry { display: flex; gap: .5rem; padding: .25rem 0; }
  .citetip .ct-entry + .ct-entry { border-top: 1px solid var(--line); margin-top: .1rem; }
  .citetip .ct-n { color: var(--accent-ink); font: 600 .78rem/1.5 var(--ui); flex: none; }
  .citetip .ct-body { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .citetip .ct-title { font-weight: 600; }
  .citetip .ct-meta { color: var(--muted); font-size: 11px; }
  .citetip .ct-doi { color: var(--accent-ink); font: 11px/1.4 var(--mono); word-break: break-all; text-decoration: none; }
  .citetip .ct-doi:hover { text-decoration: underline; }
  .citetip .ct-foot { color: var(--faint); font-size: 10px; margin-top: .35rem; padding-top: .3rem; border-top: 1px solid var(--line); }

  [data-marble-editable]:hover { background: var(--accent-soft); }
  [data-marble-editable]:focus { background: var(--card); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }

  @media (max-width: 900px) {
    .app { --rail: 0px; }
    .rail { display: none; }
    .main { grid-template-columns: 0 var(--split, 50%) minmax(0, 1fr); }
  }
</style>
</head>
